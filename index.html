<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gorle Ramesh - Educational Platform</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            /* Light theme variables (default) */
            --bg-color: #f3f4f6;
            --bg-gradient: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --text-meta: #6b7280;
            --navbar-bg: rgba(255, 255, 255, 0.75);
            --navbar-text: #1f2937;
            --navbar-border: rgba(255, 255, 255, 0.5);
            --navbar-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            --hero-bg: rgba(255, 255, 255, 0.45);
            --hero-border: rgba(255, 255, 255, 0.6);
            --hero-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.06);
            --class-header-bg: rgba(255, 255, 255, 0.45);
            --class-header-border: rgba(255, 255, 255, 0.5);
            --class-header-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
            --card-bg: rgba(255, 255, 255, 0.4);
            --card-bg-hover: rgba(255, 255, 255, 0.65);
            --card-border: rgba(255, 255, 255, 0.4);
            --card-border-hover: rgba(168, 85, 247, 0.35);
            --card-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
            --card-shadow-hover: 0 12px 40px 0 rgba(168, 85, 247, 0.15);
            --heading-color: #111827;
            --footer-bg: #ffffff;
            --footer-border: rgba(0, 0, 0, 0.05);
            --footer-text: #6b7280;
            --icon-color: #7c3aed;
            --icon-glow: rgba(124, 58, 237, 0.15);
            --toggle-bg: rgba(0, 0, 0, 0.05);
            --toggle-border: rgba(0, 0, 0, 0.08);
            --toggle-color: #1f2937;
        }

        body.dark-theme {
            /* Dark theme variables */
            --bg-color: #0b0d19;
            --bg-gradient: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
            --text-main: #f1f3f9;
            --text-muted: #a1a1aa;
            --text-meta: #9ca3af;
            --navbar-bg: rgba(11, 13, 25, 0.75);
            --navbar-text: #ffffff;
            --navbar-border: rgba(255, 255, 255, 0.08);
            --navbar-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            --hero-bg: rgba(255, 255, 255, 0.03);
            --hero-border: rgba(255, 255, 255, 0.06);
            --hero-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --class-header-bg: rgba(255, 255, 255, 0.04);
            --class-header-border: rgba(255, 255, 255, 0.06);
            --class-header-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-bg-hover: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.05);
            --card-border-hover: rgba(192, 132, 252, 0.3);
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            --card-shadow-hover: 0 12px 40px 0 rgba(192, 132, 252, 0.15);
            --heading-color: #ffffff;
            --footer-bg: #07080f;
            --footer-border: rgba(255, 255, 255, 0.05);
            --footer-text: #9ca3af;
            --icon-color: #c084fc;
            --icon-glow: rgba(192, 132, 252, 0.4);
            --toggle-bg: rgba(255, 255, 255, 0.08);
            --toggle-border: rgba(255, 255, 255, 0.15);
            --toggle-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .navbar {
            background: var(--navbar-bg) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--navbar-border);
            box-shadow: var(--navbar-shadow);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar-brand {
            color: var(--navbar-text) !important;
            font-weight: 700;
            font-size: 19px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar-brand i {
            font-size: 24px;
            color: var(--icon-color);
        }
        .navbar-nav {
            display: none;
        }
        .theme-toggle-btn {
            background: var(--toggle-bg);
            border: 1px solid var(--toggle-border);
            color: var(--toggle-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }
        .theme-toggle-btn:hover {
            transform: scale(1.1);
            background: rgba(168, 85, 247, 0.1);
            border-color: var(--icon-color);
        }
        .hero {
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: none;
            margin: 8px 16px 24px;
            padding: 24px 0 12px;
            text-align: center;
            box-shadow: none;
        }
        .hero-illustration {
            max-width: 250px;
            height: auto;
            margin-bottom: 8px;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 8px 24px rgba(168, 85, 247, 0.12));
            transition: transform 0.3s ease;
        }
        .hero-illustration:hover {
            transform: scale(1.05);
        }
        .hero h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 10px;
            line-height: 1.3;
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            font-size: 14px;
            margin-bottom: 0;
            color: var(--text-muted);
            font-weight: 500;
        }
        .classes-section {
            padding: 24px 0;
            background: transparent;
        }
        .section-title {
            text-align: center;
            padding: 0 16px;
            margin-bottom: 28px;
        }
        .section-title h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--heading-color);
            margin-bottom: 6px;
        }
        .section-title p {
            font-size: 14px;
            color: var(--text-muted);
        }
        .class-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: none;
            padding: 12px 16px 4px;
            margin: 0 16px;
            border-radius: 0;
            box-shadow: none;
        }
        .class-header h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--heading-color);
            margin-bottom: 2px;
        }
        .class-header p {
            color: var(--text-muted);
            font-size: 13px;
            margin: 0;
        }
        .carousel-nav-buttons {
            display: flex;
            gap: 8px;
        }
        .carousel-nav-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--card-shadow);
            outline: none;
        }
        .carousel-nav-btn:hover {
            background: rgba(168, 85, 247, 0.1);
            color: var(--icon-color);
            border-color: var(--icon-color);
            transform: scale(1.05);
        }
        .subjects-container {
            padding: 10px 16px 24px;
            display: flex;
            flex-direction: row;
            overflow-x: auto;
            gap: 16px;
            -webkit-overflow-scrolling: touch;
        }
        .subjects-container::-webkit-scrollbar {
            display: none; /* Hide scrollbars on mobile */
        }
        .subject-card {
            flex: 0 0 76vw; /* Show 76vw, leaving 24vw for gap + next card preview (~20% of next card) */
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--card-border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .subject-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-shadow-hover);
            border-color: var(--card-border-hover);
            background: var(--card-bg-hover);
            text-decoration: none;
        }
        .subject-card-header {
            background: rgba(255, 255, 255, 0.01);
            border-bottom: 1px solid var(--card-border);
            padding: 24px 16px;
            color: var(--text-main);
            text-align: center;
        }
        .subject-icon {
            font-size: 38px;
            margin-bottom: 10px;
            color: var(--icon-color);
            text-shadow: 0 0 15px var(--icon-glow);
        }
        .subject-card-header h5 {
            font-size: 17px;
            font-weight: 700;
            margin: 0;
            color: var(--heading-color);
        }
        .subject-card-body {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .subject-description {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 16px;
            flex: 1;
        }
        .subject-meta {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
            font-size: 12px;
        }
        .meta-badge {
            color: var(--text-meta);
            flex: 1;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .meta-badge i {
            color: var(--icon-color);
        }
        .meta-badge strong {
            color: var(--heading-color);
            font-weight: 600;
        }
        .btn-explore {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            border-radius: 8px;
            font-weight: 600;
            padding: 12px 16px;
            color: white !important;
            text-align: center;
            display: block;
            text-decoration: none;
            transition: all 0.3s ease;
            width: 100%;
            border: none;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }
        .btn-explore:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
            text-decoration: none;
        }
        footer {
            background-color: var(--footer-bg);
            border-top: 1px solid var(--footer-border);
            color: var(--footer-text);
            padding: 32px 16px;
            text-align: center;
            font-size: 13px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        footer p {
            margin: 0;
        }
        @media (min-width: 576px) {
            .hero {
                padding: 40px 0 20px;
                margin: 8px auto 20px;
                max-width: 900px;
            }
            .hero-illustration {
                max-width: 320px;
                margin-bottom: 12px;
            }
            .hero h1 {
                font-size: 34px;
            }
            .hero p {
                font-size: 16px;
            }
            .section-title {
                padding: 0;
                margin-bottom: 36px;
            }
            .section-title h2 {
                font-size: 30px;
            }
            .classes-section {
                padding: 40px 20px;
            }
            .class-header {
                max-width: 1140px;
                margin: 0 auto 24px;
            }
            .subjects-container {
                padding: 10px 0 0;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 20px;
                max-width: 1140px;
                margin: 0 auto 40px;
            }
            .subject-card {
                flex: 0 0 calc(50% - 10px);
            }
            @media (min-width: 992px) {
                .subject-card {
                    flex: 0 0 calc(33.333% - 14px);
                }
            }
            .navbar {
                padding: 14px 40px;
            }
        }

        .hero-youtube-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding: 10px 22px;
            background: rgba(255, 0, 0, 0.04);
            border: 1px solid rgba(255, 0, 0, 0.2);
            color: var(--text-main) !important;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(255, 0, 0, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hero-youtube-btn i {
            color: #ff0000;
            font-size: 15px;
        }
        .hero-youtube-btn:hover {
            background: rgba(255, 0, 0, 0.08);
            border-color: rgba(255, 0, 0, 0.45);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(255, 0, 0, 0.12);
            text-decoration: none;
        }

        /* ===== SEARCH BAR ===== */
        .search-section {
            padding: 0 16px;
            margin-top: 24px;
            margin-bottom: 8px;
            position: relative;
            z-index: 10;
        }
        .search-box-wrapper {
            position: relative;
            max-width: 900px;
            margin: 0 auto;
        }
        .search-container {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            padding: 8px 20px;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
        }
        .search-container:focus-within {
            border-color: var(--icon-color);
            box-shadow: var(--card-shadow-hover);
        }
        .search-icon {
            color: var(--text-meta);
            margin-right: 12px;
            font-size: 16px;
        }
        #globalSearchInput {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            width: 100%;
        }
        #globalSearchInput::placeholder {
            color: var(--text-meta);
        }
        .search-clear-btn {
            background: transparent;
            border: none;
            color: var(--text-meta);
            cursor: pointer;
            padding: 2px;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .search-clear-btn:hover {
            color: var(--text-main);
        }
        .search-results {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-height: 380px;
            overflow-y: auto;
            z-index: 100;
            padding: 8px 0;
        }
        .search-result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: var(--text-main);
            text-decoration: none;
            transition: all 0.2s ease;
            border-bottom: 1px solid var(--card-border);
        }
        .search-result-item:last-child {
            border-bottom: none;
        }
        .search-result-item:hover {
            background: rgba(168, 85, 247, 0.08);
            text-decoration: none;
            color: var(--text-main);
            padding-left: 24px;
        }
        .result-icon {
            width: 32px;
            height: 32px;
            background: rgba(168, 85, 247, 0.12);
            color: var(--icon-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .result-details {
            flex: 1;
            min-width: 0;
        }
        .result-title {
            font-weight: 600;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .result-breadcrumbs {
            font-size: 11px;
            color: var(--text-meta);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .result-badge {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 6px;
            background: rgba(168, 85, 247, 0.12);
            color: var(--icon-color);
            border-radius: 10px;
            flex-shrink: 0;
        }

        /* ===== CUSTOM SCROLLBARS ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.25);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(168, 85, 247, 0.5);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <a class="navbar-brand" href="index.html">
            <i class="fas fa-graduation-cap"></i> Gorle Ramesh
        </a>
        <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Light/Dark Mode">
            <i id="themeIcon" class="fas fa-moon"></i>
        </button>
    </nav>

    <!-- Search Section -->
    <div class="search-section">
        <div class="container-fluid">
            <div class="search-box-wrapper">
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="globalSearchInput" placeholder="Search for subjects, chapters, or video lessons..." oninput="handleSearch(this.value)">
                    <button id="searchClearBtn" class="search-clear-btn" onclick="clearSearch()" style="display: none;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div id="searchResults" class="search-results" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- Hero Section -->
    <div class="hero">
        <img src="illustrations/home.svg" alt="Learn From Home Illustration" class="hero-illustration">
        <h1>Learn From Home</h1>
        <p>All Classes • All Subjects • Multiple Languages</p>
        <a href="https://www.youtube.com/@gorleramesh" target="_blank" class="hero-youtube-btn">
            <i class="fab fa-youtube"></i> Visit YouTube Channel
        </a>
    </div>

    <!-- Classes Section -->
    <div class="classes-section">
        <div class="container-fluid">
            <div class="section-title">
                <h2>Choose Your Class</h2>
                <p>Select and start learning today</p>
            </div>

            <div id="classesContainer"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Gorle Ramesh Educational Platform</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        function getPreferredTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                return savedTheme;
            }
            // Fallback to system preference
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            return systemPrefersDark ? 'dark' : 'light';
        }

        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');
            
            body.classList.toggle('dark-theme');
            const isDark = body.classList.contains('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            
            if (isDark) {
                themeIcon.className = 'fas fa-sun';
            } else {
                themeIcon.className = 'fas fa-moon';
            }
        }
        
        // Initialize theme on load (as early as possible to avoid flash of light mode if dark is selected)
        (function() {
            const theme = getPreferredTheme();
            const body = document.body;
            
            if (theme === 'dark') {
                body.classList.add('dark-theme');
            } else {
                body.classList.remove('dark-theme');
            }
            
            // Wait for DOM to set toggle icon
            document.addEventListener('DOMContentLoaded', () => {
                const themeIcon = document.getElementById('themeIcon');
                if (themeIcon) {
                    if (body.classList.contains('dark-theme')) {
                        themeIcon.className = 'fas fa-sun';
                    } else {
                        themeIcon.className = 'fas fa-moon';
                    }
                }
            });
        })();

        let allClassData = {};

        async function loadClasses() {
            const container = document.getElementById('classesContainer');
            
            try {
                const classes = ['6', '7', '8', '9', '10'];
                const classData = {};

                for (const classNum of classes) {
                    try {
                        const response = await fetch(`./config/class${classNum}.json`);
                        if (response.ok) {
                            classData[classNum] = await response.json();
                        }
                    } catch (e) {
                        console.warn(`Could not load class${classNum}.json`);
                    }
                }

                allClassData = classData; // Save globally for search

                classes.forEach(classNum => {
                    const data = classData[classNum];
                    if (!data || data.length === 0) return;

                    const classSection = document.createElement('div');
                    classSection.className = 'mb-4';

                    const classHeader = document.createElement('div');
                    classHeader.className = 'class-header';
                    classHeader.innerHTML = `
                        <div class="class-header-text">
                            <h3>Class ${classNum}</h3>
                            <p>Choose a subject to explore</p>
                        </div>
                        <div class="carousel-nav-buttons">
                            <button class="carousel-nav-btn prev-btn" onclick="scrollCarousel('${classNum}', -1)" title="Scroll Left">
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            <button class="carousel-nav-btn next-btn" onclick="scrollCarousel('${classNum}', 1)" title="Scroll Right">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                    `;
                    classSection.appendChild(classHeader);

                    const subjectsContainer = document.createElement('div');
                    subjectsContainer.id = `carousel-${classNum}`;
                    subjectsContainer.className = 'subjects-container';

                    data.forEach(subject => {
                        const subjectIcon = getIconForSubject(subject.subject);
                        const courseOverview = subject.courseOverview || {};

                        const card = document.createElement('a');
                        card.href = `class.html?class=${classNum}&subject=${encodeURIComponent(subject.subject)}&medium=English`;
                        card.className = 'subject-card';
                        card.style.textDecoration = 'none';
                        card.innerHTML = `
                            <div class="subject-card-header">
                                <div class="subject-icon">
                                    <i class="fas ${subjectIcon}"></i>
                                </div>
                                <h5>${subject.subject}</h5>
                            </div>
                            <div class="subject-card-body">
                                <p class="subject-description">
                                    ${courseOverview.description ? courseOverview.description.substring(0, 60) + '...' : 'Explore this course'}
                                </p>
                                <div class="subject-meta">
                                    <div class="meta-badge">
                                        <i class="fas fa-clock"></i> ${courseOverview.duration || '-'}
                                    </div>
                                    <div class="meta-badge">
                                        <i class="fas fa-book"></i> ${subject.chapters ? subject.chapters.length : (subject.chapterwisedetails ? subject.chapterwisedetails.length : 0)} Ch
                                    </div>
                                </div>
                                <div class="btn-explore">Start Learning →</div>
                            </div>
                        `;

                        subjectsContainer.appendChild(card);
                    });

                    classSection.appendChild(subjectsContainer);
                    container.appendChild(classSection);
                });

            } catch (error) {
                console.error('Error loading classes:', error);
                container.innerHTML = '<p style="color: #dc3545; text-align: center;">Error loading courses</p>';
            }
        }

        function getIconForSubject(subject) {
            const subjectMap = {
                'Mathematics': 'fa-calculator',
                'Science': 'fa-flask',
                'English': 'fa-book',
                'Hindi': 'fa-scroll',
                'Social Studies': 'fa-globe',
                'Computer': 'fa-laptop'
            };
            return subjectMap[subject] || 'fa-graduation-cap';
        }

        function scrollCarousel(classNum, direction) {
            const container = document.getElementById(`carousel-${classNum}`);
            if (container) {
                // Scroll by approximately the width of one card + gap
                const cardWidth = container.querySelector('.subject-card')?.offsetWidth || 280;
                const scrollAmount = (cardWidth + 16) * direction;
                container.scrollBy({
                    left: scrollAmount,
                    behavior: 'smooth'
                });
            }
        }

        function handleSearch(query) {
            const resultsPanel = document.getElementById('searchResults');
            const clearBtn = document.getElementById('searchClearBtn');
            
            if (!query || query.trim().length < 2) {
                resultsPanel.style.display = 'none';
                clearBtn.style.display = 'none';
                return;
            }
            
            clearBtn.style.display = 'block';
            const searchTerm = query.toLowerCase().trim();
            const matches = [];
            
            for (const classNum in allClassData) {
                const subjects = allClassData[classNum];
                if (!Array.isArray(subjects)) continue;
                
                subjects.forEach(subject => {
                    const subjectName = subject.subject || '';
                    const medium = subject.medium || 'English';
                    const chapters = subject.chapterwisedetails || subject.chapters || [];
                    
                    if (subjectName.toLowerCase().includes(searchTerm)) {
                        matches.push({
                            type: 'subject',
                            title: subjectName,
                            breadcrumbs: `Class ${classNum} • ${medium} Medium`,
                            link: `class.html?class=${classNum}&subject=${encodeURIComponent(subjectName)}&medium=${medium}`,
                            badge: 'Subject'
                        });
                    }
                    
                    chapters.forEach(chapter => {
                        const chapterTitle = chapter.chapterTitle || chapter.chapter || '';
                        
                        if (chapterTitle.toLowerCase().includes(searchTerm)) {
                            matches.push({
                                type: 'chapter',
                                title: chapterTitle,
                                breadcrumbs: `Class ${classNum} • ${subjectName} (${medium})`,
                                link: `class.html?class=${classNum}&subject=${encodeURIComponent(subjectName)}&medium=${medium}`,
                                badge: 'Chapter'
                            });
                        }
                        
                        const subtopics = chapter.subtopics || chapter.lessons || [];
                        subtopics.forEach(lesson => {
                            const lessonName = lesson.name || '';
                            if (lesson.type && lesson.type !== 'video') return;
                            
                            if (lessonName.toLowerCase().includes(searchTerm)) {
                                matches.push({
                                    type: 'video',
                                    title: lessonName,
                                    breadcrumbs: `Class ${classNum} • ${subjectName} > ${chapterTitle.substring(0, 20)}...`,
                                    link: `class.html?class=${classNum}&subject=${encodeURIComponent(subjectName)}&medium=${medium}&lesson=${encodeURIComponent(lessonName)}`,
                                    badge: 'Video'
                                });
                            }
                        });
                    });
                });
            }
            
            renderSearchResults(matches);
        }
        
        function renderSearchResults(matches) {
            const resultsPanel = document.getElementById('searchResults');
            resultsPanel.innerHTML = '';
            
            if (matches.length === 0) {
                resultsPanel.innerHTML = `
                    <div style="padding: 16px; text-align: center; color: var(--text-muted); font-size: 13px;">
                        <i class="fas fa-info-circle" style="margin-right: 6px;"></i> No matches found for your search.
                    </div>
                `;
                resultsPanel.style.display = 'block';
                return;
            }
            
            const limitedMatches = matches.slice(0, 8);
            
            limitedMatches.forEach(match => {
                const item = document.createElement('a');
                item.href = match.link;
                item.className = 'search-result-item';
                
                const iconMap = {
                    subject: 'fa-book-open',
                    chapter: 'fa-folder-open',
                    video: 'fa-play-circle'
                };
                const icon = iconMap[match.type] || 'fa-search';
                
                item.innerHTML = `
                    <div class="result-icon">
                        <i class="fas ${icon}"></i>
                    </div>
                    <div class="result-details">
                        <div class="result-title">${match.title}</div>
                        <div class="result-breadcrumbs">${match.breadcrumbs}</div>
                    </div>
                    <div class="result-badge">${match.badge}</div>
                `;
                resultsPanel.appendChild(item);
            });
            
            resultsPanel.style.display = 'block';
        }
        
        function clearSearch() {
            document.getElementById('globalSearchInput').value = '';
            document.getElementById('searchResults').style.display = 'none';
            document.getElementById('searchClearBtn').style.display = 'none';
        }
        
        document.addEventListener('click', (e) => {
            const container = document.querySelector('.search-box-wrapper');
            const resultsPanel = document.getElementById('searchResults');
            if (container && !container.contains(e.target) && resultsPanel) {
                resultsPanel.style.display = 'none';
            }
        });

        loadClasses();
    </script>
</body>
</html>
