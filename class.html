<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Content</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #1a1919;
            color: #29303b;
        }
        .top-header {
            background: white;
            border-bottom: 1px solid #e7e9ec;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-left a {
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
        .header-title {
            font-size: 16px;
            font-weight: 600;
            color: #29303b;
        }
        .header-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .main-container {
            display: flex;
            height: calc(100vh - 60px);
        }
        .main-content {
            flex: 1;
            background: #1a1919;
            padding: 40px;
            overflow-y: auto;
        }
        .video-player {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: black;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        .video-player iframe {
            width: 100%;
            height: 500px;
            border: none;
        }
        .content-info {
            background: white;
            padding: 30px;
            border-radius: 6px;
            margin-bottom: 30px;
        }
        .content-info h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #29303b;
            margin-bottom: 15px;
        }
        .content-info p {
            color: #6a6f73;
            line-height: 1.6;
        }
        .sidebar {
            width: 400px;
            background: white;
            border-left: 1px solid #e7e9ec;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #e7e9ec;
            background: #f7f9fa;
        }
        .sidebar-header h3 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
        }
        .section {
            border-bottom: 1px solid #e7e9ec;
        }
        .section-header {
            padding: 16px;
            background: #f7f9fa;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: #29303b;
        }
        .section-header:hover {
            background: #f0f0f0;
        }
        .section-header .toggle-icon {
            transition: transform 0.3s;
        }
        .section-header.collapsed .toggle-icon {
            transform: rotate(-90deg);
        }
        .section-content {
            display: none;
            padding: 0;
        }
        .section-content.show {
            display: block;
        }
        .lesson {
            padding: 12px 16px;
            border-bottom: 1px solid #e7e9ec;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.2s;
        }
        .lesson:hover {
            background: #f7f9fa;
        }
        .lesson.active {
            background: #f3e5ff;
            border-left: 4px solid #a435f0;
            padding-left: 12px;
        }
        .lesson-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .lesson-info {
            flex: 1;
        }
        .lesson-name {
            font-weight: 500;
            color: #29303b;
            font-size: 14px;
        }
        .lesson-duration {
            font-size: 12px;
            color: #6a6f73;
        }
        .lesson-icon {
            color: #a435f0;
            font-size: 14px;
        }
        .resource-btn {
            background: #a435f0;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .resource-btn:hover {
            background: #8710d8;
        }
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-left: none;
                border-top: 1px solid #e7e9ec;
                max-height: 300px;
            }
            .video-player iframe {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="top-header">
        <div class="header-left">
            <a href="landing.html"><i class="fas fa-arrow-left"></i> Home</a>
            <span class="header-title" id="class-title">Class Content</span>
        </div>
        <div class="header-right">
            <span id="progress">0%</span>
            <button class="btn btn-sm btn-outline-primary">Share</button>
            <button class="btn btn-sm btn-outline-secondary"><i class="fas fa-ellipsis-v"></i></button>
        </div>
    </div>

    <div class="main-container">
        <div class="main-content">
            <div class="video-player">
                <iframe id="main-video" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="content-info">
                <h2 id="video-title">Select a lesson to start</h2>
                <p id="video-description">Choose a lesson from the sidebar to begin learning</p>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-header">
                <h3>Course Content</h3>
            </div>
            <div class="sidebar-content" id="sidebar-content">
                <!-- Content will be loaded here -->
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        let allLessons = [];
        let completedLessons = [];

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function playVideo(link, title, lessonElement, description = '') {
            document.getElementById('main-video').src = link;
            document.getElementById('video-title').textContent = title;
            document.getElementById('video-description').textContent = description;
            
            // Update active lesson
            document.querySelectorAll('.lesson').forEach(lesson => {
                lesson.classList.remove('active');
            });
            
            if (lessonElement) {
                lessonElement.classList.add('active');
            }
        }

        function toggleSection(button) {
            const section = button.closest('.section');
            const content = section.querySelector('.section-content');
            const header = button;
            
            content.classList.toggle('show');
            header.classList.toggle('collapsed');
        }

        function toggleLesson(checkbox) {
            const lessonName = checkbox.closest('.lesson').querySelector('.lesson-name').textContent;
            if (checkbox.checked) {
                if (!completedLessons.includes(lessonName)) {
                    completedLessons.push(lessonName);
                }
            } else {
                completedLessons = completedLessons.filter(l => l !== lessonName);
            }
            updateProgress();
        }

        function updateProgress() {
            const totalLessons = allLessons.length;
            const progress = totalLessons > 0 ? Math.round((completedLessons.length / totalLessons) * 100) : 0;
            document.getElementById('progress').textContent = progress + '%';
        }

        async function loadContent() {
            const classNum = getQueryParam('class');
            if (!classNum) {
                document.getElementById('sidebar-content').innerHTML = '<p class="p-3">No class specified.</p>';
                return;
            }

            document.getElementById('class-title').textContent = `Class ${classNum}`;

            try {
                const jsonPath = `./config/class${classNum}.json`;
                console.log('Attempting to load:', jsonPath);
                
                const response = await fetch(jsonPath);
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                console.log('Data loaded successfully:', data);
                const sidebarContent = document.getElementById('sidebar-content');
                let lessonCounter = 0;

                data.forEach((subject, subjectIndex) => {
                    const section = document.createElement('div');
                    section.className = 'section';

                    const sectionHeader = document.createElement('div');
                    sectionHeader.className = 'section-header';
                    sectionHeader.onclick = toggleSection;
                    sectionHeader.innerHTML = `
                        <span>${subject.subject}</span>
                        <i class="fas fa-chevron-down toggle-icon"></i>
                    `;

                    const sectionContent = document.createElement('div');
                    sectionContent.className = 'section-content show';

                    subject.chapterwisedetails.forEach((chapter, chapterIndex) => {
                        if (chapter.subtopics && chapter.subtopics.length > 0) {
                            chapter.subtopics.forEach((subtopic, videoIndex) => {
                                const lesson = document.createElement('div');
                                lesson.className = 'lesson';
                                
                                if (lessonCounter === 0) {
                                    lesson.classList.add('active');
                                }

                                const checkbox = document.createElement('input');
                                checkbox.type = 'checkbox';
                                checkbox.className = 'lesson-checkbox';
                                checkbox.onchange = toggleLesson;

                                const lessonInfo = document.createElement('div');
                                lessonInfo.className = 'lesson-info flex-grow-1';
                                lessonInfo.style.cursor = 'pointer';
                                lessonInfo.onclick = (e) => {
                                    if (e.target !== checkbox) {
                                        playVideo(subtopic.link, subtopic.name, lesson);
                                    }
                                };

                                const lessonName = document.createElement('div');
                                lessonName.className = 'lesson-name';
                                lessonName.textContent = `${videoIndex + 1}. ${subtopic.name}`;

                                const lessonDuration = document.createElement('div');
                                lessonDuration.className = 'lesson-duration';
                                lessonDuration.textContent = '2 min';

                                lessonInfo.appendChild(lessonName);
                                lessonInfo.appendChild(lessonDuration);

                                const lessonIcon = document.createElement('div');
                                lessonIcon.className = 'lesson-icon';
                                lessonIcon.innerHTML = '<i class="fas fa-play-circle"></i>';

                                lesson.appendChild(checkbox);
                                lesson.appendChild(lessonInfo);
                                lesson.appendChild(lessonIcon);

                                // Load first video automatically
                                if (lessonCounter === 0) {
                                    playVideo(subtopic.link, subtopic.name, lesson);
                                }

                                allLessons.push(subtopic.name);
                                sectionContent.appendChild(lesson);
                                lessonCounter++;
                            });
                        }
                    });

                    section.appendChild(sectionHeader);
                    section.appendChild(sectionContent);
                    sidebarContent.appendChild(section);
                });

                updateProgress();
            } catch (error) {
                console.error('Error loading content:', error);
                document.getElementById('sidebar-content').innerHTML = `
                    <p class="p-3 text-danger">
                        <strong>Error loading content:</strong><br>
                        ${error.message}<br>
                        <small>Check browser console for details.</small>
                    </p>
                `;
            }
        }

        loadContent();
    </script>
</body>
</html>
