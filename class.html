<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Course Content</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            /* Light theme variables (default) */
            --bg-color: #f3f4f6;
            --bg-gradient: 
                radial-gradient(at 0% 0%, rgba(168, 85, 247, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(99, 102, 241, 0.06) 0px, transparent 50%);
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --text-meta: #6b7280;
            --navbar-bg: rgba(255, 255, 255, 0.8);
            --navbar-text: #1f2937;
            --navbar-border: rgba(0, 0, 0, 0.06);
            --navbar-shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
            --main-bg: transparent;
            --panel-bg: rgba(255, 255, 255, 0.55);
            --panel-border: rgba(255, 255, 255, 0.6);
            --panel-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
            --sidebar-bg: rgba(255, 255, 255, 0.65);
            --sidebar-header-bg: rgba(255, 255, 255, 0.85);
            --chapter-header-bg: rgba(255, 255, 255, 0.45);
            --chapter-header-hover: rgba(255, 255, 255, 0.7);
            --chapter-content-bg: rgba(255, 255, 255, 0.25);
            --lesson-bg-hover: rgba(255, 255, 255, 0.5);
            --lesson-bg-active: rgba(168, 85, 247, 0.12);
            --lesson-text-active: #7c3aed;
            --lesson-border-active: #7c3aed;
            --progress-bar-bg: rgba(0, 0, 0, 0.06);
            --icon-color: #7c3aed;
            --btn-watch-bg: #ff0000;
            --btn-watch-border: #ff0000;
            --btn-watch-text: #ffffff;
            --btn-watch-hover: #cc0000;
        }

        body.dark-theme {
            /* Dark theme variables */
            --bg-color: #0b0d19;
            --bg-gradient: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.12) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
            --text-main: #f1f3f9;
            --text-muted: #a1a1aa;
            --text-meta: #9ca3af;
            --navbar-bg: rgba(11, 13, 25, 0.75);
            --navbar-text: #ffffff;
            --navbar-border: rgba(255, 255, 255, 0.08);
            --navbar-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            --main-bg: transparent;
            --panel-bg: rgba(255, 255, 255, 0.02);
            --panel-border: rgba(255, 255, 255, 0.05);
            --panel-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --sidebar-bg: rgba(17, 20, 34, 0.65);
            --sidebar-header-bg: rgba(11, 13, 25, 0.85);
            --chapter-header-bg: rgba(255, 255, 255, 0.02);
            --chapter-header-hover: rgba(255, 255, 255, 0.05);
            --chapter-content-bg: rgba(0, 0, 0, 0.15);
            --lesson-bg-hover: rgba(255, 255, 255, 0.03);
            --lesson-bg-active: rgba(168, 85, 247, 0.15);
            --lesson-text-active: #c084fc;
            --lesson-border-active: #c084fc;
            --progress-bar-bg: rgba(255, 255, 255, 0.1);
            --icon-color: #c084fc;
            --btn-watch-bg: #ff0000;
            --btn-watch-border: #ff0000;
            --btn-watch-text: #ffffff;
            --btn-watch-hover: #cc0000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ===== NAVBAR ===== */
        .navbar-top {
            background: var(--navbar-bg);
            border-bottom: 1px solid var(--navbar-border);
            box-shadow: var(--navbar-shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 55px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }
        .nav-back {
            background: none;
            border: none;
            color: var(--icon-color);
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
            display: flex;
            align-items: center;
            height: 30px;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }
        .nav-back:hover {
            transform: translateX(-2px);
        }
        .nav-logo {
            display: none;
            align-items: center;
            gap: 6px;
            color: var(--icon-color);
            font-weight: 700;
            font-size: 13px;
            white-space: nowrap;
        }
        .nav-logo i {
            font-size: 16px;
        }
        .nav-class-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .nav-controls {
            display: flex;
            gap: 8px;
            margin-left: 10px;
        }
        .nav-controls select {
            font-size: 12px;
            padding: 2px 20px 2px 8px;
            height: 28px;
            border-radius: 4px;
            border: 1px solid var(--navbar-border);
            appearance: auto;
            background-color: var(--navbar-bg);
            color: var(--text-main);
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }
        .nav-controls select:focus {
            border-color: var(--icon-color);
        }
        .nav-progress {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            flex-shrink: 0;
        }
        .progress-bar-nav {
            width: 80px;
            height: 6px;
            background: var(--progress-bar-bg);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar-nav-fill {
            height: 100%;
            background: var(--icon-color);
            transition: width 0.3s;
        }

        /* ===== TOAST ===== */
        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--icon-color);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(164, 53, 240, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
        }
        .toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ===== MAIN CONTAINER ===== */
        .main-container {
            display: flex;
            flex-direction: column;
        }
        .main-content {
            background: var(--main-bg);
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        /* ===== VIDEO PLAYER ===== */
        .video-player {
            width: 100%;
            background: #000;
            aspect-ratio: 16 / 9;
            flex-shrink: 0;
            padding: 0 !important;
            margin: 0 !important;
            position: relative;
            overflow: hidden;
        }
        .video-player iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
            display: block;
            margin: 0;
            padding: 0;
        }
        @supports (aspect-ratio: 16 / 9) {
            .video-player iframe {
                position: absolute;
                top: 0;
                left: 0;
            }
        }

        /* ===== LESSON INFO ===== */
        .lesson-info {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border);
            padding: 16px;
            flex-shrink: 0;
            box-shadow: var(--panel-shadow);
        }
        .lesson-info h2 {
            font-size: 16px;
            font-weight: 700;
            color: var(--heading-color);
            margin-bottom: 4px;
        }
        .lesson-description {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 0;
        }

        /* ===== RESOURCES ===== */
        .resources-section {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border);
            padding: 16px;
            flex-shrink: 0;
            display: none;
            box-shadow: var(--panel-shadow);
        }
        .resources-section.show {
            display: block;
        }
        .resources-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            margin-bottom: 8px;
        }
        .resources-header h3 {
            font-size: 13px;
            font-weight: 700;
            color: var(--heading-color);
            margin: 0;
        }
        .resources-header i.toggle-icon {
            transition: transform 0.2s;
            color: var(--text-meta);
            font-size: 12px;
        }
        .resources-section.collapsed .resources-header {
            margin-bottom: 0;
        }
        .resources-section.collapsed .toggle-icon {
            transform: rotate(-90deg);
        }
        .resources-section.collapsed .resource-tabs,
        .resources-section.collapsed .resource-list {
            display: none;
        }
        .resource-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            margin-bottom: 8px;
            padding-bottom: 4px;
        }
        .resource-tabs::-webkit-scrollbar {
            height: 2px;
        }
        .resource-tabs::-webkit-scrollbar-thumb {
            background: var(--icon-color);
            border-radius: 2px;
        }
        .resource-tab {
            padding: 5px 10px;
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            background: var(--chapter-header-bg);
            cursor: pointer;
            font-weight: 500;
            font-size: 10px;
            color: var(--text-muted);
            white-space: nowrap;
            transition: all 0.2s;
        }
        .resource-tab.active {
            border-color: var(--icon-color);
            color: var(--icon-color);
            background: rgba(168, 85, 247, 0.1);
        }
        .resource-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .resource-item {
            padding: 10px 12px;
            background: var(--chapter-header-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .resource-item:hover {
            background: var(--chapter-header-hover);
            border-color: var(--icon-color);
        }
        .resource-name {
            font-weight: 500;
            color: var(--text-main);
            font-size: 12px;
        }
        .resource-btn {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(168, 85, 247, 0.25);
            transition: all 0.2s ease;
        }
        .resource-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.35);
            color: white;
            text-decoration: none;
        }

        .chapter-resources-container {
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.02);
            border-top: 1px solid var(--panel-border);
        }
        body.dark-theme .chapter-resources-container {
            background: rgba(255, 255, 255, 0.02);
        }
        .chapter-resource-link {
            display: block;
            font-size: 12px;
            color: var(--icon-color);
            padding: 4px 0;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .chapter-resource-link:hover {
            text-decoration: underline;
            color: var(--lesson-text-active);
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 100%;
            background: var(--sidebar-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--panel-border);
            background: var(--sidebar-header-bg);
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
            color: var(--text-main);
        }
        .sidebar-content {
            overflow-y: auto;
            flex: 1;
        }
        .chapter-section {
            border-bottom: 1px solid var(--panel-border);
        }
        .chapter-header {
            padding: 12px 16px;
            background: var(--chapter-header-bg);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: var(--text-main);
            border: none;
            font-size: 13px;
            width: 100%;
            text-align: left;
            transition: background 0.2s ease;
        }
        .chapter-header:hover {
            background: var(--chapter-header-hover);
        }
        .chapter-header .toggle-icon {
            transition: transform 0.2s;
            font-size: 11px;
        }
        .chapter-header.collapsed .toggle-icon {
            transform: rotate(-90deg);
        }
        .chapter-content {
            display: none;
            background: var(--chapter-content-bg);
            padding: 0;
        }
        .chapter-content.show {
            display: block;
        }
        .lesson {
            padding: 12px 16px;
            border-bottom: 1px solid var(--panel-border);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
            font-size: 13px;
            color: var(--text-main);
        }
        .lesson:hover {
            background: var(--lesson-bg-hover);
        }
        .lesson.active {
            background: var(--lesson-bg-active);
            border-left: 4px solid var(--lesson-border-active);
            color: var(--lesson-text-active);
            padding-left: 14px;
        }
        .lesson-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            flex-shrink: 0;
            accent-color: var(--icon-color);
        }
        .lesson-info-item {
            flex: 1;
        }
        .lesson-name {
            font-weight: 600;
            color: var(--text-main);
            font-size: 13px;
        }
        .lesson-duration {
            font-size: 11px;
            color: var(--text-meta);
            margin-top: 2px;
        }
        .lesson-icon {
            color: var(--icon-color);
            font-size: 12px;
            flex-shrink: 0;
        }

        /* ===== DESKTOP LAYOUT ===== */
        @media (min-width: 768px) {
            body {
                height: 100vh;
                overflow: hidden;
            }
            .navbar-top {
                padding: 10px 20px;
                height: 60px;
            }
            .nav-logo {
                display: flex;
            }
            .nav-progress {
                display: flex;
            }
            .nav-controls select {
                font-size: 14px;
                height: 32px;
                padding: 2px 24px 2px 10px;
            }
            .nav-class-name {
                font-size: 15px;
            }
            .main-container {
                flex-direction: row;
                height: calc(100vh - 60px);
                overflow: hidden;
            }
            .main-content {
                flex: 1;
                overflow-y: auto;
                padding: 24px;
                gap: 20px;
            }
            .video-player {
                aspect-ratio: 16 / 9;
                border-radius: 16px;
                box-shadow: 0 12px 40px rgba(0,0,0,0.15);
                border: 1px solid var(--panel-border);
            }
            .lesson-info {
                background: var(--panel-bg);
                padding: 24px;
                border-radius: 16px;
                border: 1px solid var(--panel-border);
                box-shadow: var(--panel-shadow);
                margin-bottom: 0;
            }
            .lesson-info h2 {
                font-size: 22px;
            }
            .lesson-description {
                font-size: 14px;
            }
            .resources-section {
                background: var(--panel-bg);
                padding: 24px;
                border-radius: 16px;
                border: 1px solid var(--panel-border);
                box-shadow: var(--panel-shadow);
                margin-bottom: 0;
            }
            .resources-section h3 {
                font-size: 16px;
            }
            .resource-name {
                font-size: 13px;
            }
            .resource-btn {
                font-size: 12px;
                padding: 6px 16px;
            }
            .resource-tab {
                font-size: 12px;
                padding: 6px 12px;
            }
            .sidebar {
                width: 340px;
                border-top: none;
                border-left: 1px solid var(--panel-border);
                overflow-y: auto;
            }
            .sidebar-header {
                font-size: 15px;
                padding: 16px 20px;
            }
            .chapter-header {
                font-size: 14px;
                padding: 14px 20px;
            }
            .lesson {
                padding: 12px 20px;
            }
            .lesson-name {
                font-size: 13px;
            }
            .lesson-duration {
                font-size: 12px;
            }
        }

        /* ===== MOBILE NAVBAR OPTIMIZATIONS ===== */
        @media (max-width: 767px) {
            .nav-left {
                gap: 4px;
            }
            .nav-class-name {
                display: none;
            }
            .nav-controls {
                gap: 4px;
                margin-left: 4px;
            }
            .nav-controls select {
                font-size: 11px;
                padding: 2px 14px 2px 4px;
                height: 28px;
                max-width: 105px;
            }
            #mediumSelect {
                max-width: 75px;
            }
            .nav-progress {
                gap: 4px;
                font-size: 12px;
            }
            .progress-bar-nav {
                display: none;
            }
        }

        /* ===== DARK THEME OVERRIDES FOR DYNAMIC BUTTONS ===== */
        body.dark-theme .theme-toggle-btn {
            border-color: rgba(255, 255, 255, 0.15) !important;
            background: rgba(255, 255, 255, 0.08) !important;
            color: #ffffff !important;
        }

        .youtube-watch-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 12px;
            white-space: nowrap;
            border-radius: 6px;
            background: rgba(255, 0, 0, 0.04);
            border: 1px solid rgba(255, 0, 0, 0.2);
            color: var(--text-main) !important;
            padding: 6px 14px;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(255, 0, 0, 0.05);
        }
        .youtube-watch-btn i {
            color: #ff0000;
            font-size: 14px;
        }
        .youtube-watch-btn:hover {
            background: rgba(255, 0, 0, 0.08);
            border-color: rgba(255, 0, 0, 0.45);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 0, 0, 0.12);
            text-decoration: none;
        }

        /* ===== CUSTOM SCROLLBARS ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.25);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(168, 85, 247, 0.5);
        }
     </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar-top">
        <div class="nav-left">
            <button class="nav-back" onclick="window.location.href='index.html';" title="Back">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="nav-logo">
                <i class="fas fa-book"></i>
                <span>Gorle Ramesh</span>
            </div>
            <div class="nav-class-name" id="classNameDisplay">Class 6</div>
            
            <!-- Dropdowns for Subject and Medium -->
            <div class="nav-controls">
                <select id="subjectSelect" onchange="changeSubject(this.value)">
                    <option value="">Loading...</option>
                </select>
                <select id="mediumSelect" onchange="changeMedium(this.value)">
                    <option value="English">English</option>
                    <option value="Telugu">Telugu</option>
                </select>
            </div>
        </div>
        <div class="nav-progress">
            <span id="progressText">0%</span>
            <div class="progress-bar-nav">
                <div class="progress-bar-nav-fill" id="progressBarFill" style="width: 0%"></div>
            </div>
            <button id="themeToggleBtn" class="theme-toggle-btn ml-2" onclick="toggleTheme()" title="Toggle Light/Dark Mode" style="border: 1px solid #e7e9ec; background: #f7f9fa; color: #29303b; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; outline: none; transition: all 0.3s;">
                <i id="themeIcon" class="fas fa-moon" style="font-size: 11px;"></i>
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toastNotification" class="toast-notification"></div>

    <!-- Main Container -->
    <div class="main-container">
        <div class="main-content">
            <!-- Video Player -->
            <div class="video-player">
                <iframe id="main-video" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen; web-payment; xr-spatial-tracking" allowfullscreen allow-same-origin></iframe>
            </div>

            <!-- Lesson Info -->
            <div class="lesson-info">
                <div class="d-flex justify-content-between align-items-start align-items-sm-center flex-column flex-sm-row">
                    <div style="flex: 1; min-width: 0; padding-right: 12px;">
                        <h2 id="lessonTitle" style="margin-bottom: 4px;">Select a lesson</h2>
                        <p class="lesson-description" id="lessonDescription">Choose a lesson from the list</p>
                    </div>
                    <a id="youtubeWatchBtn" href="#" target="_blank" class="youtube-watch-btn mt-2 mt-sm-0" style="display: none;">
                        <i class="fab fa-youtube"></i> Watch video on YouTube
                    </a>
                </div>
            </div>

            <!-- Resources -->
            <div class="resources-section collapsed" id="resourcesSection">
                <div class="resources-header" onclick="toggleResources()">
                    <h3>Resources</h3>
                    <i class="fas fa-chevron-down toggle-icon"></i>
                </div>
                <div class="resource-tabs" id="resourceTabs"></div>
                <div class="resource-list" id="resourceList"></div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-book"></i> Chapters & Lessons
            </div>
            <div class="sidebar-search" style="padding: 10px 14px; border-bottom: 1px solid var(--panel-border); background: var(--sidebar-header-bg);">
                <div style="position: relative; display: flex; align-items: center;">
                    <i class="fas fa-search" style="position: absolute; left: 10px; color: var(--text-meta); font-size: 12px;"></i>
                    <input type="text" id="sidebarSearchInput" placeholder="Search lessons..." oninput="filterSidebar(this.value)" style="width: 100%; padding: 6px 10px 6px 28px; border-radius: 6px; border: 1px solid var(--panel-border); background: var(--chapter-header-bg); color: var(--text-main); font-size: 12px; outline: none; transition: all 0.2s ease;">
                    <i class="fas fa-times-circle" id="sidebarSearchClear" onclick="clearSidebarSearch()" style="position: absolute; right: 10px; color: var(--text-meta); font-size: 12px; cursor: pointer; display: none;"></i>
                </div>
            </div>
            <div class="sidebar-content" id="sidebar-content">
                <p style="padding: 16px; color: #6a6f73; font-size: 13px;">Loading content...</p>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        function getPreferredTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                return savedTheme;
            }
            // Fallback to system preference
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            return systemPrefersDark ? 'dark' : 'light';
        }

        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');
            
            body.classList.toggle('dark-theme');
            const isDark = body.classList.contains('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            
            if (isDark) {
                themeIcon.className = 'fas fa-sun';
            } else {
                themeIcon.className = 'fas fa-moon';
            }
        }
        
        // Initialize theme on load (as early as possible to avoid flash of light mode if dark is selected)
        (function() {
            const theme = getPreferredTheme();
            const body = document.body;
            
            if (theme === 'dark') {
                body.classList.add('dark-theme');
            } else {
                body.classList.remove('dark-theme');
            }
            
            // Wait for DOM to set toggle icon
            document.addEventListener('DOMContentLoaded', () => {
                const themeIcon = document.getElementById('themeIcon');
                if (themeIcon) {
                    if (body.classList.contains('dark-theme')) {
                        themeIcon.className = 'fas fa-sun';
                    } else {
                        themeIcon.className = 'fas fa-moon';
                    }
                }
            });
        })();

        let currentClass = '';
        let courseData = [];
        let currentSubject = null;
        let currentMedium = 'English';
        let allLessons = [];
        let completedLessons = [];
        let phrases = ["Great job!", "Keep going!", "Awesome!", "You rock!"];
        let currentSubjectData = null;
        
        // Mobile detection and optimization
        const isMobileDevice = () => /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        const IS_MOBILE = isMobileDevice();
        
        // Initialize mobile video fixes
        if (IS_MOBILE) {
            document.addEventListener('DOMContentLoaded', function() {
                const videoPlayer = document.getElementById('main-video');
                if (videoPlayer) {
                    // Add mobile-specific attributes
                    videoPlayer.setAttribute('playsinline', 'true');
                    videoPlayer.setAttribute('webkit-playsinline', 'true');
                    videoPlayer.setAttribute('controls', 'true');
                    
                    // Handle video errors on mobile
                    videoPlayer.addEventListener('error', function(e) {
                        console.warn('Video loading error on mobile:', e);
                        // Attempt reload after delay
                        setTimeout(() => {
                            if (videoPlayer.src) {
                                videoPlayer.src = videoPlayer.src;
                            }
                        }, 1000);
                    });
                }
            });
        }

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function updateURLParams(subject, medium) {
            const classNum = getQueryParam('class') || '6';
            const newUrl = `class.html?class=${classNum}&subject=${encodeURIComponent(subject)}&medium=${encodeURIComponent(medium)}`;
            window.history.replaceState({}, '', newUrl);
        }

        // Generate a unique key for storing progress (includes class, subject, and medium)
        function getStorageKey() {
            return `course_progress_class${currentClass}_${currentSubject || 'none'}_${currentMedium || 'English'}`;
        }

        // Save completed lessons to localStorage
        function saveProgress() {
            try {
                const key = getStorageKey();
                localStorage.setItem(key, JSON.stringify(completedLessons));
            } catch (error) {
                console.error('Error saving progress to localStorage:', error);
            }
        }

        // Load completed lessons from localStorage
        function loadProgress() {
            try {
                const key = getStorageKey();
                const saved = localStorage.getItem(key);
                completedLessons = saved ? JSON.parse(saved) : [];
            } catch (error) {
                console.error('Error loading progress from localStorage:', error);
                completedLessons = [];
            }
        }

        // Clear progress for current subject (useful for testing)
        function clearProgress() {
            try {
                const key = getStorageKey();
                localStorage.removeItem(key);
                completedLessons = [];
                updateProgress();
                // Update all checkboxes to be unchecked
                document.querySelectorAll('.lesson-checkbox').forEach(checkbox => {
                    checkbox.checked = false;
                });
            } catch (error) {
                console.error('Error clearing progress:', error);
            }
        }

        function updateProgress() {
            const totalLessons = allLessons.length;
            
            // Only count completed lessons that currently exist in the loaded course data
            const validCompletedCount = completedLessons.filter(lessonId => allLessons.includes(lessonId)).length;
            
            let progress = totalLessons > 0 ? Math.round((validCompletedCount / totalLessons) * 100) : 0;
            if (progress > 100) progress = 100; // Cap at 100%
            
            document.getElementById('progressText').textContent = progress + '%';
            document.getElementById('progressBarFill').style.width = progress + '%';
        }

        function playLesson(lessonElement, lessonData, chapterData) {
            // Support both new 'link' format and old 'videoUrl' format
            let videoUrl = lessonData.link || lessonData.videoUrl || '';
            const videoPlayer = document.getElementById('main-video');
            
            // Append enablejsapi=1 for YouTube API events
            if (videoUrl.includes('youtube.com') || videoUrl.includes('youtu.be')) {
                if (videoUrl.includes('?')) {
                    if (!videoUrl.includes('enablejsapi=1')) {
                        videoUrl += '&enablejsapi=1';
                    }
                } else {
                    videoUrl += '?enablejsapi=1';
                }
            }
            
            // Check if ytPlayer is active and initialized
            if (ytPlayer && typeof ytPlayer.loadVideoByUrl === 'function') {
                try {
                    ytPlayer.loadVideoByUrl(videoUrl);
                } catch (e) {
                    console.log('YT API load failed, falling back to src:', e);
                    videoPlayer.src = videoUrl;
                }
            } else {
                videoPlayer.src = videoUrl;
                if (typeof YT !== 'undefined' && YT.Player && !ytPlayer) {
                    setTimeout(initYTPlayer, 1000);
                }
            }
            
            const lessonName = currentMedium === 'Telugu' ? (lessonData.nameTelugu || lessonData.name) : lessonData.name;
            document.getElementById('lessonTitle').textContent = lessonName || 'Lesson';
            document.getElementById('lessonDescription').textContent = lessonData.description || 'Explore this topic to learn more.';
            
            // Update YouTube Watch button
            const watchBtn = document.getElementById('youtubeWatchBtn');
            if (watchBtn) {
                const watchLink = getYouTubeWatchLink(videoUrl);
                if (watchLink) {
                    watchBtn.href = watchLink;
                    watchBtn.title = `Watch "${lessonName}" on YouTube`;
                    watchBtn.style.display = 'inline-flex';
                } else {
                    watchBtn.style.display = 'none';
                }
            }

            document.querySelectorAll('.lesson').forEach(lesson => lesson.classList.remove('active'));
            if (lessonElement) lessonElement.classList.add('active');

            updateResourcesPanel(lessonData, chapterData);
        }

        function getYouTubeWatchLink(embedLink) {
            if (!embedLink) return '';
            const match = embedLink.match(/\/embed\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://www.youtube.com/watch?v=${match[1]}`;
            }
            // If it's already a YouTube URL but not in embed format
            if (embedLink.includes('youtube.com') || embedLink.includes('youtu.be')) {
                return embedLink;
            }
            return '';
        }

        function resolveResourceLink(link) {
            if (!link) return '';
            // If it's already an absolute URL or a relative path starting with / or ./ or ../
            if (/^(https?:\/\/|data:|mailto:|tel:|\/|\.\/|\.\.\/)/i.test(link)) {
                return link;
            }
            // If it already explicitly references resources/ or resource/
            if (/^(resources\/|resource\/)/i.test(link)) {
                return link;
            }
            // Prepend resources/
            return 'resources/' + link;
        }

        function updateResourcesPanel(lessonData, chapterData) {
            const resourcesSection = document.getElementById('resourcesSection');
            const resourceTabs = document.getElementById('resourceTabs');
            const resourceList = document.getElementById('resourceList');
            
            resourceTabs.innerHTML = '';
            resourceList.innerHTML = '';

            let resources = [];
            
            // Collect resources from lesson, chapter, or subject
            if (lessonData && lessonData.resources && Array.isArray(lessonData.resources) && lessonData.resources.length > 0) {
                resources = lessonData.resources;
            } else if (chapterData && chapterData.resources && Array.isArray(chapterData.resources) && chapterData.resources.length > 0) {
                resources = chapterData.resources;
            } else if (currentSubjectData && currentSubjectData.resources && Array.isArray(currentSubjectData.resources)) {
                resources = currentSubjectData.resources;
            }

            if (!resources || resources.length === 0) {
                resourcesSection.classList.remove('show');
                return;
            }

            resourcesSection.classList.add('show');
            resourcesSection.classList.add('collapsed');

            resources.forEach((resource, index) => {
                const iconClass = resource.type === 'video' ? 'fa-video' : (resource.type === 'pdf' ? 'fa-file-pdf' : 'fa-file-alt');
                
                const item = document.createElement('div');
                item.className = 'resource-item';
                item.style.marginBottom = '6px';
                item.innerHTML = `
                    <div class="resource-name"><i class="fas ${iconClass}" style="margin-right: 6px;"></i>${resource.name || 'Resource ' + (index + 1)}</div>
                    <a href="${resolveResourceLink(resource.link)}" target="_blank" class="resource-btn">Open</a>
                `;
                resourceList.appendChild(item);
            });
        }

        function displayResourcesOfType(type, lessonData) {
            // Deprecated: Kept for backwards compatibility if needed, but the logic is now handled entirely within updateResourcesPanel.
        }

        function toggleResources() {
            const resourcesSection = document.getElementById('resourcesSection');
            resourcesSection.classList.toggle('collapsed');
        }

        function toggleChapter(button) {
            const chapter = button.closest('.chapter-section');
            const content = chapter.querySelector('.chapter-content');
            content.classList.toggle('show');
            button.classList.toggle('collapsed');
        }

        function toggleLessonCheckbox(checkbox, lessonName) {
            if (checkbox.checked) {
                if (!completedLessons.includes(lessonName)) {
                    completedLessons.push(lessonName);
                    
                    // Throw confetti
                    if (typeof confetti === 'function') {
                        confetti({
                            particleCount: 100,
                            spread: 70,
                            origin: { y: 0.6 },
                            colors: ['#a435f0', '#ffffff', '#5624d0']
                        });
                    }
                    
                    // Show encouragement
                    showEncouragement();
                }
            } else {
                completedLessons = completedLessons.filter(l => l !== lessonName);
            }
            updateProgress();
            saveProgress(); // Save to localStorage whenever progress changes
        }

        function showEncouragement() {
            const toast = document.getElementById('toastNotification');
            const phrase = phrases[Math.floor(Math.random() * phrases.length)];
            toast.textContent = phrase;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function populateSubjectDropdown() {
            const subjectSelect = document.getElementById('subjectSelect');
            subjectSelect.innerHTML = '';
            
            if (!courseData || courseData.length === 0) {
                subjectSelect.innerHTML = '<option value="">No Subjects Found</option>';
                return;
            }
            
            // Get unique subjects
            const subjects = [...new Set(courseData.map(item => item.subject))];
            
            subjects.forEach(subject => {
                const option = document.createElement('option');
                option.value = subject;
                option.textContent = subject;
                if (subject === currentSubject) {
                    option.selected = true;
                }
                subjectSelect.appendChild(option);
            });
        }

        function changeSubject(newSubject) {
            if (newSubject && newSubject !== currentSubject) {
                currentSubject = newSubject;
                updateURLParams(currentSubject, currentMedium);
                loadSubject(currentSubject);
            }
        }

        function changeMedium(newMedium) {
            if (newMedium && newMedium !== currentMedium) {
                currentMedium = newMedium;
                updateURLParams(currentSubject, currentMedium);
                // Optionally reload subject if you want to re-render names in new language
                loadSubject(currentSubject);
            }
        }

        async function loadContent() {
            currentClass = getQueryParam('class') || '6';
            const initialSubject = getQueryParam('subject');
            const initialMedium = getQueryParam('medium') || 'English';
            
            currentMedium = initialMedium;
            document.getElementById('mediumSelect').value = currentMedium;
            document.getElementById('classNameDisplay').textContent = `Class ${currentClass}`;

            try {
                // Try to load phrases first
                try {
                    const phraseRes = await fetch('./config/phrases.json');
                    if (phraseRes.ok) {
                        phrases = await phraseRes.json();
                    }
                } catch(e) { 
                    console.log('Using default phrases'); 
                }

                const response = await fetch(`./config/class${currentClass}.json`);
                if (!response.ok) throw new Error('Failed to load class ' + currentClass + ' config');
                
                courseData = await response.json();
                
                populateSubjectDropdown();

                // Auto-select first subject if not specified
                const subjectToLoad = initialSubject || (courseData.length > 0 ? courseData[0].subject : null);
                if (subjectToLoad) {
                    currentSubject = subjectToLoad;
                    document.getElementById('subjectSelect').value = currentSubject;
                    loadSubject(subjectToLoad);
                    updateURLParams(subjectToLoad, currentMedium);
                }

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('sidebar-content').innerHTML = `<p style="padding: 16px; color: #dc3545; font-size: 13px;">Error loading content: ${error.message}</p>`;
            }
        }

        function loadSubject(subjectName) {
            currentSubject = subjectName;
            
            // Reset sidebar search input
            const searchInput = document.getElementById('sidebarSearchInput');
            if (searchInput) {
                searchInput.value = '';
                const clearBtn = document.getElementById('sidebarSearchClear');
                if (clearBtn) clearBtn.style.display = 'none';
            }
            
            // Check for medium specific data if needed. Currently JSON has 'medium' field, we can filter by it if multiple exist, 
            // but usually it's just 'English' in the json. We'll filter if possible, otherwise fallback to first match.
            let subject = courseData.find(s => s.subject === subjectName && s.medium === currentMedium);
            if (!subject) {
                // fallback to any medium if specific one not found
                subject = courseData.find(s => s.subject === subjectName);
            }
            
            if (!subject) {
                document.getElementById('sidebar-content').innerHTML = `<p style="padding: 16px; color: #dc3545; font-size: 13px;">Subject not found in data.</p>`;
                return;
            }
            
            currentSubjectData = subject;

            // Load progress for this subject BEFORE rendering
            loadProgress();

            const sidebarContent = document.getElementById('sidebar-content');
            sidebarContent.innerHTML = '';
            allLessons = [];
            let lessonCounter = 0;
            let foundAnyLesson = false;

            // Support both 'chapterwisedetails' (current JSON format) and legacy 'chapters' format
            const chapters = subject.chapterwisedetails || subject.chapters || [];

            let lessonToPlayDiv = null;
            let lessonToPlayData = null;
            let lessonToPlayChapter = null;
            const initialLessonName = getQueryParam('lesson');

            if (chapters.length > 0) {
                chapters.forEach((chapter) => {
                    const chapterSection = document.createElement('div');
                    chapterSection.className = 'chapter-section';

                    const chapterHeader = document.createElement('button');
                    chapterHeader.className = 'chapter-header';
                    chapterHeader.onclick = () => toggleChapter(chapterHeader);
                    
                    const chapterTitle = currentMedium === 'Telugu' ? (chapter.chapterTitleTelugu || chapter.chapterTitle || chapter.chapter) : (chapter.chapterTitle || chapter.chapter || 'Chapter');
                    let resourceBadge = '';
                    if (chapter.resources && Array.isArray(chapter.resources) && chapter.resources.length > 0) {
                        const count = chapter.resources.length;
                        resourceBadge = ` <span class="chapter-resource-badge" style="color: var(--icon-color); font-size: 11px; font-weight: 600; margin-left: 6px; display: inline-flex; align-items: center; gap: 2px;"><i class="fas fa-paperclip" style="font-size: 9px;"></i>${count} Resource${count > 1 ? 's' : ''}</span>`;
                    }
                    chapterHeader.innerHTML = `<span>${chapterTitle}${resourceBadge}</span><i class="fas fa-chevron-down toggle-icon"></i>`;

                    const chapterContent = document.createElement('div');
                    chapterContent.className = 'chapter-content show'; // start expanded

                    // Support both 'subtopics' (current format) and legacy 'lessons' format
                    const lessons = chapter.subtopics || chapter.lessons || [];

                    if (lessons.length > 0) {
                        lessons.forEach((lesson, lessonIndex) => {
                            // In JSON, type is "video". Sometimes missing, we assume video if link exists.
                            if (lesson.type && lesson.type !== 'video') return;

                            const lessonDisplayName = currentMedium === 'Telugu' ? (lesson.nameTelugu || lesson.name) : lesson.name;
                            const isTarget = initialLessonName ? (lessonDisplayName === initialLessonName) : (lessonCounter === 0);

                            const lessonDiv = document.createElement('div');
                            lessonDiv.className = 'lesson';

                            const checkbox = document.createElement('input');
                            checkbox.type = 'checkbox';
                            checkbox.className = 'lesson-checkbox';
                            const uniqueLessonId = `${chapterTitle} - ${lessonDisplayName}`;
                            
                            // Check if this lesson was previously completed
                            checkbox.checked = completedLessons.includes(uniqueLessonId);
                            checkbox.onchange = () => toggleLessonCheckbox(checkbox, uniqueLessonId);

                            const lessonInfo = document.createElement('div');
                            lessonInfo.className = 'lesson-info-item';
                            lessonInfo.style.cursor = 'pointer';
                            lessonInfo.onclick = (e) => {
                                if (e.target !== checkbox) playLesson(lessonDiv, lesson, chapter);
                            };

                            const lessonName = document.createElement('div');
                            lessonName.className = 'lesson-name';
                            lessonName.textContent = `${lessonIndex + 1}. ${lessonDisplayName}`;

                            const lessonDuration = document.createElement('div');
                            lessonDuration.className = 'lesson-duration';
                            lessonDuration.textContent = lesson.duration || 'Video Lesson';

                            lessonInfo.appendChild(lessonName);
                            lessonInfo.appendChild(lessonDuration);

                            const lessonIcon = document.createElement('div');
                            lessonIcon.className = 'lesson-icon';
                            lessonIcon.innerHTML = '<i class="fas fa-play-circle"></i>';

                            lessonDiv.appendChild(checkbox);
                            lessonDiv.appendChild(lessonInfo);
                            lessonDiv.appendChild(lessonIcon);

                            if (isTarget) {
                                lessonToPlayDiv = lessonDiv;
                                lessonToPlayData = lesson;
                                lessonToPlayChapter = chapter;
                            } else if (lessonCounter === 0 && !lessonToPlayDiv) {
                                lessonToPlayDiv = lessonDiv;
                                lessonToPlayData = lesson;
                                lessonToPlayChapter = chapter;
                            }

                            allLessons.push(uniqueLessonId);
                            chapterContent.appendChild(lessonDiv);
                            lessonCounter++;
                            foundAnyLesson = true;
                        });
                    }

                    // Also handle 'resources' array directly under chapter if any
                    if (chapter.resources && chapter.resources.length > 0) {
                        const resContainer = document.createElement('div');
                        resContainer.className = 'chapter-resources-container';
                        chapter.resources.forEach(res => {
                            if (!res.link) return;
                            const resLink = document.createElement('a');
                            resLink.href = resolveResourceLink(res.link);
                            resLink.target = '_blank';
                            resLink.className = 'chapter-resource-link';
                            resLink.innerHTML = `<i class="fas fa-file-alt" style="margin-right:6px;"></i>${res.name || 'Resource'}`;
                            resContainer.appendChild(resLink);
                        });
                        chapterContent.appendChild(resContainer);
                    }

                    // Only append chapter if it has content
                    if (chapterContent.children.length > 0) {
                        chapterSection.appendChild(chapterHeader);
                        chapterSection.appendChild(chapterContent);
                        sidebarContent.appendChild(chapterSection);
                    }
                });
            }

            // Play the selected lesson (or first lesson fallback)
            if (lessonToPlayDiv && lessonToPlayData) {
                lessonToPlayDiv.classList.add('active');
                playLesson(lessonToPlayDiv, lessonToPlayData, lessonToPlayChapter);
            }

            if (!foundAnyLesson) {
                if (sidebarContent.children.length === 0) {
                    sidebarContent.innerHTML = `<p style="padding: 16px; color: #6a6f73; font-size: 13px;">No content available for this subject.</p>`;
                }
                // Clear video player
                document.getElementById('main-video').src = '';
                document.getElementById('lessonTitle').textContent = 'Resources & Study Materials';
                document.getElementById('lessonDescription').textContent = 'This subject contains study resources. Please select files from the chapters in the sidebar.';
            }

            updateProgress();
        }

        function filterSidebar(query) {
            const clearBtn = document.getElementById('sidebarSearchClear');
            if (query.trim().length > 0) {
                clearBtn.style.display = 'block';
            } else {
                clearBtn.style.display = 'none';
            }

            const filterText = query.toLowerCase().trim();
            const chapters = document.querySelectorAll('.chapter-section');

            chapters.forEach(chapter => {
                const headerText = chapter.querySelector('.chapter-header span')?.textContent.toLowerCase() || '';
                const lessons = chapter.querySelectorAll('.lesson');
                let matchesLessonCount = 0;

                lessons.forEach(lesson => {
                    const lessonNameText = lesson.querySelector('.lesson-name')?.textContent.toLowerCase() || '';
                    if (lessonNameText.includes(filterText)) {
                        lesson.style.setProperty('display', 'flex', 'important');
                        matchesLessonCount++;
                    } else {
                        lesson.style.setProperty('display', 'none', 'important');
                    }
                });

                if (headerText.includes(filterText)) {
                    lessons.forEach(lesson => {
                        lesson.style.setProperty('display', 'flex', 'important');
                    });
                    chapter.style.setProperty('display', 'block', 'important');
                } else if (matchesLessonCount > 0) {
                    chapter.style.setProperty('display', 'block', 'important');
                } else {
                    chapter.style.setProperty('display', 'none', 'important');
                }
            });
        }

        function clearSidebarSearch() {
            const input = document.getElementById('sidebarSearchInput');
            if (input) {
                input.value = '';
                filterSidebar('');
            }
        }

        // ===== AUTOPLAY NEXT LESSON FUNCTIONALITY =====
        let ytPlayer = null;

        // Load YouTube Iframe Player API dynamically
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        window.onYouTubeIframeAPIReady = function() {
            initYTPlayer();
        };

        function initYTPlayer() {
            if (ytPlayer) {
                try {
                    ytPlayer.destroy();
                } catch(e) {}
            }
            const iframe = document.getElementById('main-video');
            if (iframe && typeof YT !== 'undefined' && YT.Player) {
                try {
                    ytPlayer = new YT.Player('main-video', {
                        events: {
                            'onStateChange': onPlayerStateChange
                        }
                    });
                } catch(e) {
                    console.log('Error initializing YT Player API:', e);
                }
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === 0) { // YT.PlayerState.ENDED
                // Autocomplete active lesson checkbox
                const activeLesson = document.querySelector('.lesson.active');
                if (activeLesson) {
                    const checkbox = activeLesson.querySelector('.lesson-checkbox');
                    if (checkbox && !checkbox.checked) {
                        checkbox.checked = true;
                        // Fire change event to save progress
                        checkbox.dispatchEvent(new Event('change'));
                        showToast("Lesson completed! 🎉");
                    }
                }
                
                // Load next lesson automatically
                playNextLesson();
            }
        }

        function playNextLesson() {
            const lessons = Array.from(document.querySelectorAll('.lesson'));
            const activeIndex = lessons.findIndex(lesson => lesson.classList.contains('active'));
            
            if (activeIndex !== -1 && activeIndex < lessons.length - 1) {
                let nextIndex = activeIndex + 1;
                while (nextIndex < lessons.length) {
                    const nextLesson = lessons[nextIndex];
                    // Skip hidden elements (filtered out by search)
                    if (nextLesson.style.display !== 'none') {
                        const clickableInfo = nextLesson.querySelector('.lesson-info-item');
                        if (clickableInfo) {
                            showToast("Autoplay: Loading next lesson...");
                            setTimeout(() => {
                                clickableInfo.click();
                            }, 1000); // 1s smooth transition delay
                        }
                        break;
                    }
                    nextIndex++;
                }
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toastNotification');
            if (toast) {
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }
        }

        // Initialize
        loadContent();
    </script>
</body>
</html>
